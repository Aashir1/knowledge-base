<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="FE interview preparation notes">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Notes',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        paths: 'auto',
        placeholder: 'Search topics...',
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      darklightTheme: {
        siteFont: 'PT Sans',
        defaultTheme: 'light',
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        bodyFontSize: '17px',
        dark: {
          accent: '#58c9a3',
          toogleBackground: '#f5f5f5',
          background: '#1e1e1e',
          textColor: '#dcdcdc',
          codeTextColor: '#f0f0f0',
          codeBackgroundColor: '#2a2a2a',
          borderColor: '#333333',
          blockQuoteColor: '#9a9a9a',
          highlightColor: '#ffca28',
          sidebarSublink: '#b0b0b0',
          codeTypeColor: '#f0f0f0',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/sun.svg)'
        },
        light: {
          accent: '#217a53',
          toogleBackground: '#1e1e1e',
          background: '#ffffff',
          textColor: '#24292f',
          codeTextColor: '#24292f',
          codeBackgroundColor: '#f6f8fa',
          borderColor: '#e1e4e8',
          blockQuoteColor: '#6a737d',
          highlightColor: '#e8590c',
          sidebarSublink: '#57606a',
          codeTypeColor: '#24292f',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/moon.svg)'
        }
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
</body>
</html>
